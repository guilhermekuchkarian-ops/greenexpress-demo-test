<title>GreenExpress · DEMO app</title>
<style>:root{--bg:#000;--card:#0f110f;--card2:#151815;--line:#252a25;--line2:#323832;--tx:#f3f6f2;--mu:#a3ada3;--g:#93d651;--g2:#55b34f;--gd:#18240f;--warn:#f2c14e;--wd:#2a2208;--bad:#ff7a6b;--bd:#2c1210;--info:#7cc4ff;--id:#0d1f2c;--r:16px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
body.has-tabs main{padding-bottom:calc(96px + var(--safe))}
a{color:var(--g)}a:hover{color:#b6ec7c}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--g);color:#000;padding:10px;z-index:99}.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--g);outline-offset:2px;border-radius:6px}
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:6px max(12px,env(safe-area-inset-left)) 6px 12px;min-height:60px}
.brand{display:flex;align-items:center;flex:0 1 auto;min-width:0}.brand img{display:block;height:56px;width:auto;max-width:46vw;object-fit:contain}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.langs{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}.langs button{background:none;border:0;color:var(--mu);font-family:inherit;font-size:12px;font-weight:600;line-height:1;padding:9px 6px;min-width:31px;min-height:38px;cursor:pointer}.langs button.on{background:var(--g);color:#000}
.who{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line2);color:var(--tx);border-radius:999px;padding:5px 10px 5px 7px;font-family:inherit;font-size:13px;font-weight:600;line-height:1.1;cursor:pointer;min-height:36px;max-width:30vw}.who span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{display:none;color:var(--mu);font-weight:500}

.rxbanner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;margin:0 0 10px;font-size:17px;border:2px solid var(--line2)}.rxbanner span{font-size:24px}.rxbanner small{display:block;font-size:13px;font-weight:400;margin-left:auto;text-align:right}
.rxbanner.match{background:#0e3a1d;border-color:#2fbf62}.rxbanner.review{background:#3a2a07;border-color:#e0a526}.rxbanner.dup{background:#4a0e0e;border-color:#ff4d4d;animation:gxpulse .5s 2}.rxbanner.idle{background:var(--card)}
@keyframes gxpulse{50%{transform:scale(1.02)}}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.presets .btn{min-width:48px}
.camera-first{margin-bottom:8px}.linkbtn{background:none;border:0;color:#9fd9b0;text-decoration:underline;padding:0;font:inherit;cursor:pointer}
.minikpi{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin:0 0 8px}.minikpi>*{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.label46{background:#fff;color:#000;width:100%;max-width:300px;aspect-ratio:4/6;margin:8px auto;border-radius:6px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;font-family:system-ui}.label46 .l-top{display:flex;justify-content:space-between;font-size:13px}.label46 .l-bin{font-size:46px;font-weight:900;text-align:center;letter-spacing:2px}.label46 .barcode svg{width:100%;height:80px}.label46 .l-id{font-size:22px;font-weight:800;text-align:center}.label46 .l-row{display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:2px solid #000;padding-top:6px}
@media print{@page{size:4in 6in;margin:0}body.printing .label46{width:4in;max-width:none;height:6in;aspect-ratio:auto;border-radius:0;margin:0}}
.zone{margin:8px 0}.bins{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.bin{display:flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:5px 8px;text-decoration:none;color:inherit;font-size:13px}.bin i{font-style:normal;background:#1f6b3a;border-radius:6px;padding:0 6px}
.desk.today{border-left:3px solid #65df91;padding-left:8px}.proof{border:1px dashed var(--line2);border-radius:10px;padding:6px 10px;margin:8px 0}.quote{background:#121512;border-left:3px solid #65df91;padding:8px;border-radius:6px}
.section-h{margin:16px 0 8px}.img-retry{display:block;margin:6px auto}.img-failed{opacity:.8}
.net{font-size:13px;padding:6px 12px;text-align:center}.net.off{background:#4a0e0e;color:#fff}.net.on{background:#101b2a}.net a{color:inherit}
.sticky-actions{position:sticky;bottom:calc(68px + var(--safe,0px));background:linear-gradient(transparent,var(--bg,#000) 30%);padding-top:10px}
.big{font-size:22px;font-weight:800}
#rx .decision{position:static}
[hidden]{display:none!important}
.btn.primary,.att .btn{min-height:44px}
</style>

<script>/* GreenExpress V14 app (demo). UI only — all data access goes through window.GXB. */
(function () {

  let lang = (() => { try { const l = JSON.parse(localStorage.getItem('ge5lang')); return ['en', 'pt', 'es'].includes(l) ? l : null; } catch (e) { return null; } })()

  const locale = () => lang === 'pt' ? 'pt-BR' : lang === 'es' ? 'es-US' : 'en-US';
  const money = n => n == null ? t('customQuote') : new Intl.NumberFormat(locale(), { style: 'currency', currency: 'USD', currencyDisplay: lang === 'en' ? 'narrowSymbol' : 'symbol' }).format(n).replace(/^USD\s?/, 'US$ ');
  const date = ts => new Date(ts).toLocaleDateString(locale(), { month: 'short', day: 'numeric' });
  const dateTime = ts => new Date(ts).toLocaleString(locale(), { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const isoDay = ts => new Date(ts).toISOString().slice(0, 10);

  const sizeName = s => t('size_' + s);

  const errMsg = e => { const code = e && e.code ? e.code : 'unexpected'; const m = I[lang]['err_' + code] ?? I.en['err_' + code]; return m ? t('err_' + code, e.info ? { ...(e.info.left != null ? { left: e.info.left } : {}), ...(e.info.amount != null ? { amount: money(e.info.amount) } : {}) } : null) : t('err_unexpected') + ' (' + esc(code) + ')'; };

  }

    catch (e) { if (!(e instanceof B.GXError)) console.error(e); toast(errMsg(e), 'bad'); return undefined; }

      signin: () => { closeModal(); B.signInAs(el.dataset.user); RX = null; go(homeFor(B.currentUser())); },
      signout: () => { closeModal(); B.signOut(); RX = null; go('welcome'); },
      switch: () => modal(`<h2>${t('switchUser')}</h2><div class="personas">${PERSONAS.map(([id, ic, k]) => `<button class="persona" data-act="signin" data-user="${id}"><span class="pic">${ic}</span><span><b>${t(k + 'Name')}</b><small>${t(k + 'Desc')}</small></span></button>`).join('')}${(B.raw().users || []).filter(u => u.role === 'customer' && !PERSONAS.some(p => p[0] === u.id)).map(u => `<button class="persona" data-act="signin" data-user="${esc(u.id)}"><span class="pic">🙂</span><span><b>${esc(u.name || u.email)}</b><small>${t('demoAccountMine')}</small></span></button>`).join('')}</div><button class="btn ghost wide" data-act="signout">${t('signOut')}</button>`),
      copy: () => copy(el.dataset.text),
      closeModal, pay: () => openPay(el.dataset.id),
      payWith: () => { const r = run(() => B.authorizePayment(el.dataset.id, el.dataset.card)); closeModal(); if (r) { B.dispatch(); toast(r.ok ? t('payOk') : t('payDeclined'), r.ok ? 'ok' : 'bad'); if (r.ok && r.status === 'ready_for_pickup') go('c/pass/' + el.dataset.id); else render(); } },
      cancelRel: async () => { if (await ask(t('confirmCancel'))) { run(() => B.cancelRelease(el.dataset.id), t('cancelled')); render(); } },
      releaseSel: () => go('c/release?ids=' + $$('[data-sel]:checked').map(x => x.dataset.sel).join(',')),
      plan: () => { run(() => B.updateProfile({ plan: el.value }), t('saved')); render(); },
      autodetect: () => { run(() => B.updateProfile({ autoDetect: el.checked }), t('saved')); render(); },
      whatsapp: () => { const r = run(() => B.updateProfile({ whatsappOptIn: el.checked, phone: $('#waPhone').value })); if (r === undefined) el.checked = false; else toast(t('saved'), 'ok'); },
      rotateAlias: async () => { if (await ask(t('confirmRotate'))) { run(() => B.rotateAlias(), t('saved')); render(); } },
      clearTrip: () => { run(() => B.setTrip(null), t('saved')); render(); },
      siRestart: () => { sessionStorage.removeItem('gx_signin'); render(); },
      rxScan: () => $('#rx').doScan(), rxCamera: () => cameraScan(),
      rxDemoPhoto: () => { rxRead(); if (RX.photos.length < 6) RX.photos.push(demoPhoto(RX.labelCode || 'NO CODE')); B.saveDraft(RX); render(); },
      rxDelPhoto: () => { rxRead(); RX.photos.splice(Number(el.dataset.i), 1); B.saveDraft(RX); render(); },
      printLabel: () => { const w = $('#printArea'); if (w) { document.body.classList.add('printing'); window.print && window.print(); setTimeout(() => document.body.classList.remove('printing'), 500); } },
      rxSuggestBin: () => { rxRead(); const sz = B.classify(RX.dims.l, RX.dims.w, RX.dims.h, RX.dims.wt); const d = RX.scan ? B.staffPreviewCheckIn({ tracking: RX.tracking, labelCode: RX.labelCode, noCode: RX.noCode, labelName: RX.labelName, multiPiece: RX.multiPiece }) : { decision: 'matched' }; $('#rx').bin.value = B.suggestBin(sz, d.decision !== 'matched'); rxRead(); rxDecision(); },
      rxResume: () => { RX = B.getDraft(); if (RX && !Array.isArray(RX.photos)) RX.photos = RX.photo ? [RX.photo] : []; if (RX && RX.tracking) { try { RX.scan = B.staffScanTracking(RX.tracking); } catch (x) { RX.scan = null; } } render(); },
      rxDiscard: () => { B.saveDraft(null); RX = null; render(); },
      rxLogDup: () => { run(() => B.staffLogDuplicateScan(RX.tracking), t('dupLogged')); RX = null; B.saveDraft(null); render(); },
      rxCommit: async () => {
        rxRead();
        if (!await ask(RX.scan && B.staffPreviewCheckIn({ tracking: RX.tracking, labelCode: RX.labelCode, noCode: RX.noCode, labelName: RX.labelName, multiPiece: RX.multiPiece }).decision === 'matched' ? t('confirmCheckIn') : t('confirmException'))) return;
        try {
          const r = B.staffCheckIn({ ...RX, carrier: RX.carrier || detectCarrier(RX.tracking) || 'Other' });
          B.saveDraft(null); RX = null; B.dispatch();
          modal(`<h2>${r.decision === 'matched' ? '✅ ' + t('checkedInTitle') : '⚠️ ' + t('exceptionTitle')}</h2><div class="label-print" id="printArea"><div class="barcode">${window.GXBarcode.svg(r.id)}</div><div class="mono">${esc(r.bin)}</div><div>${r.customer ? esc(r.customer.code + ' · ' + r.customer.name) : t('rs_' + r.reason)}</div><div>${sizeName(r.size)}</div></div><p class="muted small">${r.decision === 'matched' ? t('notifQueued') : t('noNotifException')}</p><button class="btn wide" data-act="printLabel">🖨️ ${t('printLabel')}</button><button class="btn primary wide" data-act="nextPkg">${t('nextPackage')}</button>`);
        } catch (err) { toast(errMsg(err), 'bad'); if (err.code === 'commit_interrupted') toast(t('interruptedSaved'), 'bad'); render(); }
      },
      nextPkg: () => { closeModal(); render(); setTimeout(() => $('#rxTracking') && $('#rxTracking').focus(), 50); },
      dispatch: () => { const r = B.dispatch(true); toast(t('dispatched', { sent: r.sent, failed: r.failed })); render(); },
      retryN: () => { run(() => B.retryNotification(el.dataset.id)); const r = B.dispatch(true); toast(t('dispatched', { sent: r.sent, failed: r.failed })); render(); },
      setting: () => { run(() => B.setSetting(el.dataset.k, el.checked), t('saved')); if (el.dataset.k === 'emailOutage' && !el.checked) B.dispatch(true); render(); },
      clock: () => { run(() => B.advanceClock(1)); B.dispatch(true); toast(t('clockAdvanced')); render(); },
      reset: async () => { if (await ask(t('confirmReset'))) { B.resetDemo(); RX = null; go('welcome'); toast(t('demoReset')); } },
      dStart: () => { if (run(() => B.driverStart(el.dataset.id)) !== undefined) { B.dispatch(); render(); } },
      dDemoPhoto: () => { driverPhotos[el.dataset.id] = demoPhoto('DELIVERED'); render(); },
      selftest: () => { const res = B.selfTest(); const ok = res.filter(r => r.ok).length; $('#stOut').innerHTML = `<h2>${ok}/${res.length} ${t('passed')}</h2><ol class="pipeline">${res.map(r => `<li class="${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'} ${esc(r.name)} ${r.err ? '<small>' + esc(r.err) + '</small>' : ''}</li>`).join('')}</ol><p class="muted small">${t('selfTestNote')}</p>`; }
    };
    const fn = acts[a] || (XACTS[a] && (() => XACTS[a](el, e)));
    if (fn) { if (el.tagName === 'A' || (el.tagName === 'BUTTON' && el.type !== 'submit')) e.preventDefault(); fn(); }
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  window.addEventListener('hashchange', () => { if (location.hash.startsWith('#/')) memRoute = location.hash.slice(2); render(); });
  window.addEventListener('storage', e => { if (e.key === 'gx_app_demo_v14') location.reload(); });
  // Background notification dispatcher + storage reminders (server: cron + queue worker).
  setInterval(() => { try { B.dispatch(); } catch (e) { } }, 20000);
  try { B.storageSweep(); B.dispatch(); } catch (e) { }
  if (!B.storageOk()) setTimeout(() => toast(t('storageUnavailable'), 'bad'), 500);
  render();
  window.GXApp = { render, t, setLang: l => { lang = l; render(); } };
})();
</script>
</body>
</html>
